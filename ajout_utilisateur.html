<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Ajout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style2.css">
    
</head>
<body>
    <div class="formulaire">
        <div class="container">
            <form action="" method="post">
                <legend>Formulaire d'enregistrement</legend>
                <div class="row">
                
                    <div class="mb-3 col-6">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" aria-describedby="writename" placeholder="*Votre nom" required>
                    </div>

                    <div class="mb-3 col-6">
                        <label for="prenom" class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="prenom" placeholder="*Votre prénom" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="departement" class="form-label">Département</label>
                    <input type="text" class="form-control" id="departement" placeholder="*Votre departement">
                </div>

                <div class="mb-3">
                    <label for="contact" class="form-label">Contact</label>
                    <input type="tel" class="form-control" id="telephone" placeholder="*Votre numéro" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="prenom" placeholder="*Votre mail" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Se souvenir</label>
                </div>

                <div>
                    
                    <a href="#" class="btn btn-primary">Ajouter</a>
                
                    <a  class="btn btn-danger" href="index.html">Annuler</a>
                </div>
                
            </form>
        </div>
    </div>
    
</body>
</html>
